name: Tabular
description: >-
  Tabular was an independent, managed cloud data platform and storage engine built on Apache Iceberg,
  founded in 2021 by Ryan Blue, Daniel Weeks, and Jason Reid — two of the original creators of Apache
  Iceberg and a former head of Data Engineering at Netflix. Its central product was a managed Iceberg
  catalog exposed over the open Apache Iceberg REST Catalog protocol (an OpenAPI-defined common API),
  giving any compute engine vendor-neutral access to a single copy of data. Databricks agreed to acquire
  Tabular in June 2024 and closed the deal that month; the founders joined Databricks and the standalone
  product was wound down. As of this enrichment pass the tabular.io domain no longer resolves and the
  tabular-io GitHub organization has no public repositories, so there is no live first-party API surface
  to harvest. This profile is retained as a historical/acquired-company record in the API Evangelist network.
